name: Build and Publish Cluster Ops Console to GHCR

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      # ── 质量门禁：本地先编译运行 AMD64 镜像并探测健康检查，通过后才允许发布 ──
      - name: Build local test image (AMD64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: local-test:latest
          cache-from: type=gha

      - name: Pre-flight smoke test
        run: |
          set -euo pipefail
          docker run -d --name smoke-test -p 8080:8080 -e OPS_READ_TOKEN="test_read_tok" -e OPS_WRITE_TOKEN="test_write_tok" -e ADMIN_PASSWORD="test_password" local-test:latest
          echo "Waiting for cluster-ops to become healthy..."
          passed=0
          for i in $(seq 1 30); do
            if curl -sS http://127.0.0.1:8080/api/auth-check | grep -q "authenticated"; then
              echo "✅ Pre-flight smoke test passed on attempt $i!"
              passed=1
              break
            fi
            sleep 2
          done
          if [ "$passed" -ne 1 ]; then
            echo "❌ Service failed healthcheck, aborting publish to GHCR!"
            echo "--- Container logs ---"
            docker logs smoke-test 2>&1 || true
            docker rm -f smoke-test >/dev/null 2>&1 || true
            exit 1
          fi
          docker rm -f smoke-test >/dev/null 2>&1 || true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
